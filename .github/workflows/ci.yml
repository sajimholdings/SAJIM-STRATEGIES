name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  engine:
    name: Python engine (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,backtrader]"
      - run: pytest
      - name: Registry export is reproducible
        run: |
          sajim list
          sajim export --public-dir /tmp/public
          test -s /tmp/public/leaderboard.json

  dashboard:
    name: Dashboard (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
