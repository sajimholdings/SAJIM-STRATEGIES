[pytest]
# Only tests/ is collected. The strategy folders contain many files named
# test_*.py that are research scripts rather than tests (the BEEP package alone
# has 24), and collecting them executes network calls and long sweeps.
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Treat an unraisable return value as an error: a test that returns instead of
# asserting silently passed before.
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning

markers =
    integration: needs a live external dependency (MT5 terminal, broker creds)
    slow: takes more than ~30s

addopts = -q --strict-markers
